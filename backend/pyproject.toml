[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brillion-backend"
version = "0.1.0"
description = "Server-authoritative multiplayer trivia backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "openai>=1.60,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.11,<4",
  "redis>=5.2,<7",
  "sentry-sdk[fastapi]>=2.20,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "fakeredis>=2.26,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"app/seed_data.py" = ["E501"]

